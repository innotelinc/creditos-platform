name: creditos

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creditos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creditos}
      POSTGRES_DB: ${POSTGRES_DB:-creditos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creditos} -d ${POSTGRES_DB:-creditos}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-creditos}:${POSTGRES_PASSWORD:-creditos}@postgres:5432/${POSTGRES_DB:-creditos}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-creditos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ${SMTP_FROM:-"CreditOS <no-reply@creditos.local>"}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-please-12345}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-please-67890}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_PORT: "3001"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek/deepseek-chat}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Optional explicit Stripe Price IDs per plan (auto-created when unset and a key is present)
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PROFESSIONAL: ${STRIPE_PRICE_PROFESSIONAL:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      RUN_SEED: ${RUN_SEED:-true}
      # Credit pulls — automatic report ingestion via consumer share codes
      # (simulated | smartcredit | identityiq)
      CREDIT_PULL_PROVIDER: ${CREDIT_PULL_PROVIDER:-simulated}
      CREDIT_PULL_COST_CENTS: ${CREDIT_PULL_COST_CENTS:-1200}
      CREDIT_PULL_OVERAGE_CENTS: ${CREDIT_PULL_OVERAGE_CENTS:-1500}
      CREDIT_PULL_OVERAGE_POLICY: ${CREDIT_PULL_OVERAGE_POLICY:-metered}
      CREDIT_MONITORING_PRICE_CENTS: ${CREDIT_MONITORING_PRICE_CENTS:-2995}
      CREDIT_PULL_SHARE_SECRET: ${CREDIT_PULL_SHARE_SECRET:-}
      SMARTCREDIT_API_BASE_URL: ${SMARTCREDIT_API_BASE_URL:-}
      SMARTCREDIT_API_KEY: ${SMARTCREDIT_API_KEY:-}
      IDENTITYIQ_API_BASE_URL: ${IDENTITYIQ_API_BASE_URL:-}
      IDENTITYIQ_API_KEY: ${IDENTITYIQ_API_KEY:-}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NEST_API_URL: http://api:3001
      APP_URL: ${APP_URL:-http://localhost:3000}
      PORT: "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
