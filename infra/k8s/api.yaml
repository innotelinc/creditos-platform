apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: creditos
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: creditos-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: creditos-config }
            - secretRef: { name: creditos-secrets }
          env:
            - { name: DATABASE_URL, value: "postgresql://creditos:change-me@postgres:5432/creditos?schema=public" }
          readinessProbe:
            httpGet: { path: /health/ready, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: creditos
spec:
  selector: { app: api }
  ports:
    - port: 3001
      targetPort: 3001
